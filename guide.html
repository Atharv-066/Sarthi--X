<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Step-by-step guide to a government document in Amravati: where to go, who handles it and what to carry.">
<meta name="color-scheme" content="light dark">
<script>try{var t=localStorage.getItem("sx_theme");if(t!=="dark"&&t!=="light")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t;document.documentElement.style.colorScheme=t}catch(e){}</script>
<title>Document Guide — Sarthi - X</title>
<style>html.auth-pending{visibility:hidden}</style>
<script>document.documentElement.classList.add("auth-pending")</script>
<link rel="stylesheet" href="assets/style.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1652F0">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  .breadcrumb{ padding:18px 0 0; font-size:13px; color:var(--ink-soft); }
  .breadcrumb a:hover{ color:var(--blue); }
  .doc-hero{ padding:16px 0 30px; display:flex; gap:20px; align-items:flex-start; flex-wrap:wrap; }
  .doc-hero .icon-badge{ width:64px; height:64px; font-size:30px; }
  .doc-hero h1{ font-size:27px; }
  .doc-hero p.desc{ color:var(--ink-soft); font-size:14.5px; margin-top:6px; max-width:64ch; }
  .kpi-row{ display:flex; gap:14px; flex-wrap:wrap; margin-top:16px; }
  .kpi{ padding:12px 16px; display:flex; align-items:center; gap:10px; min-width:150px; max-width:340px; }
  .kpi .n{ font-family:'Poppins'; font-weight:700; font-size:14px; line-height:1.3; }
  .kpi .l{ font-size:11.5px; color:var(--ink-soft); }

  .layout{ display:grid; grid-template-columns:2.1fr 1fr; gap:28px; padding-bottom:60px; align-items:start; }
  .steps-title{ font-size:19px; margin:0 0 16px; }
  .g-section{ margin-bottom:34px; }

  .route-card{ padding:20px 22px; margin-bottom:34px; }
  .g-info{ display:grid; grid-template-columns:130px 1fr; gap:6px 16px; padding:11px 0; border-bottom:1px solid var(--line); font-size:13.5px; }
  .g-info:last-child{ border-bottom:none; padding-bottom:0; }
  .g-info:first-of-type{ padding-top:0; }
  .g-info .k{ color:var(--ink-soft); font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; padding-top:2px; }
  .g-info .v{ color:var(--navy); font-weight:500; }

  .step{ display:flex; gap:16px; margin-bottom:6px; }
  .step .rail{ display:flex; flex-direction:column; align-items:center; }
  .step .num{ width:34px; height:34px; border-radius:50%; background:var(--blue); color:#fff; font-family:'Poppins'; font-weight:700; font-size:14px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .step .connector{ width:2px; flex:1; background:var(--line); margin:4px 0; }
  .step:last-child .connector{ display:none; }
  .step-card{ padding:14px 18px; margin-bottom:14px; flex:1; }
  .step-card .g-item{ font-size:14px; color:var(--ink); margin:0; line-height:1.55; }

  .tabs-row{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; }
  button.chip{ font-family:inherit; cursor:pointer; }
  .g-note{ background:var(--amber-bg); border:1px solid rgba(245,158,11,.35); border-radius:12px; padding:14px 16px; font-size:13.5px; margin-top:16px; color:var(--ink); }
  .g-note b{ color:var(--navy); }
  .g-done{ padding:16px 20px; font-size:14px; }

  .side-card{ padding:22px; margin-bottom:20px; }
  .side-card h4{ font-size:15px; margin-bottom:12px; }
  .side-card p{ font-size:13.5px; color:var(--ink-soft); margin:0 0 12px; }
  .checklist{ list-style:none; margin:0; padding:0; }
  .checklist li{ display:flex; align-items:flex-start; gap:9px; font-size:13.5px; padding:7px 0; border-bottom:1px solid var(--line); }
  .checklist li:last-child{ border-bottom:none; }
  .checklist li .tick{ color:var(--green); font-weight:700; }
  .related-row{ display:flex; flex-direction:column; gap:8px; }
  .related-row a{ font-size:13.5px; font-weight:600; padding:9px 12px; border-radius:9px; background:var(--bg); }
  .related-row a:hover{ color:var(--blue); }
  .src-note{ font-size:12px; color:var(--ink-soft); line-height:1.5; }

  .missing{ padding:40px 0 70px; max-width:640px; }
  .missing h1{ font-size:24px; margin-bottom:10px; }
  .missing p{ color:var(--ink-soft); margin-bottom:18px; }

  @media(max-width:880px){ .layout{ grid-template-columns:1fr; } .g-info{ grid-template-columns:1fr; gap:2px; } }
</style>
</head>

</html>
