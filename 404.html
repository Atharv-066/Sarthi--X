<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<script>try{var t=localStorage.getItem("sx_theme");if(t!=="dark"&&t!=="light")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t;document.documentElement.style.colorScheme=t}catch(e){}</script>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="manifest" href="/manifest.webmanifest">
<title>Page not found — Sarthi - X</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
  .nf{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; text-align:center; }
  .nf .box{ max-width:520px; }
  .nf .code{ font-family:'Poppins',sans-serif; font-weight:700; font-size:84px; line-height:1; color:var(--blue); }
  .nf h1{ font-size:24px; margin:10px 0 8px; }
  .nf p{ color:var(--ink-soft); font-size:14.5px; }
  .nf .row{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:22px; }
</style>
</head>
<body>
<main class="nf"><div class="box">
  <div class="code">404</div>
  <h1>We could not find that page</h1>
  <p>The link may be old or mistyped. Try one of these instead.</p>
  <div class="row">
    <a class="btn btn-primary btn-sm" href="/index.html">Home</a>
    <a class="btn btn-outline btn-sm" href="/dashboard.html">Search documents</a>
    <a class="btn btn-outline btn-sm" href="/schemes.html">Browse schemes</a>
  </div>
</div></main>
</body>
</html>
