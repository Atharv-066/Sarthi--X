<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" fill="none" role="img" aria-label="A phone checklist, a certificate with a seal and an ID card joined by a dotted route">
  <defs>
    <linearGradient id="gb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4C7CFF"/><stop offset="1" stop-color="#1652F0"/></linearGradient>
    <linearGradient id="ga" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFC24B"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#0F1B3D" flood-opacity=".22"/></filter>
    <filter id="sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0F1B3D" flood-opacity=".25"/></filter>
  </defs>

  <!-- backdrop -->
  <ellipse cx="330" cy="212" rx="305" ry="196" fill="#1652F0" fill-opacity=".10"/>
  <ellipse cx="330" cy="212" rx="235" ry="150" fill="#1652F0" fill-opacity=".07"/>
  <circle cx="584" cy="62" r="44" fill="#F59E0B" fill-opacity=".22"/>
  <circle cx="52" cy="352" r="36" fill="#16A34A" fill-opacity=".20"/>

  <!-- dotted route: phone -> certificate -> ID -> office pin -->
  <path d="M176 398 C 260 428, 330 372, 410 384 S 566 392, 596 316" stroke="#1652F0" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="1 11" opacity=".75"/>

  <!-- ID card -->
  <g transform="rotate(6 450 255)" filter="url(#sh)">
    <rect x="338" y="168" width="226" height="142" rx="15" fill="#FFFFFF"/>
    <path d="M338 183a15 15 0 0 1 15-15h196a15 15 0 0 1 15 15v17H338z" fill="url(#ga)"/>
    <circle cx="358" cy="184" r="7" fill="#fff" fill-opacity=".9"/>
    <rect x="372" y="178" width="92" height="7" rx="3.5" fill="#fff" fill-opacity=".9"/>
    <rect x="372" y="189" width="58" height="5" rx="2.5" fill="#fff" fill-opacity=".6"/>
    <rect x="354" y="214" width="62" height="76" rx="9" fill="#E6EDFF"/>
    <circle cx="385" cy="240" r="14" fill="#8FA8F0"/>
    <path d="M360 290c0-16 11-26 25-26s25 10 25 26z" fill="#8FA8F0"/>
    <rect x="428" y="216" width="104" height="8" rx="4" fill="#0F1B3D"/>
    <rect x="428" y="233" width="78" height="6" rx="3" fill="#C9D3EA"/>
    <rect x="428" y="247" width="92" height="6" rx="3" fill="#C9D3EA"/>
    <rect x="428" y="261" width="64" height="6" rx="3" fill="#C9D3EA"/>
    <g fill="#0F1B3D">
      <rect x="516" y="262" width="9" height="9" rx="1.5"/><rect x="528" y="262" width="9" height="9" rx="1.5"/><rect x="516" y="274" width="9" height="9" rx="1.5"/>
      <rect x="540" y="274" width="9" height="9" rx="1.5"/><rect x="528" y="286" width="9" height="9" rx="1.5"/>
    </g>
    <rect x="428" y="276" width="48" height="14" rx="7" fill="#EAF9EF"/>
    <circle cx="438" cy="283" r="4" fill="#16A34A"/>
    <rect x="446" y="281" width="24" height="4" rx="2" fill="#16A34A" fill-opacity=".7"/>
  </g>

  <!-- certificate -->
  <g transform="rotate(-5 270 125)" filter="url(#sh)">
    <rect x="138" y="26" width="276" height="196" rx="16" fill="#FFFFFF"/>
    <path d="M138 42a16 16 0 0 1 16-16h244a16 16 0 0 1 16 16v30H138z" fill="url(#gb)"/>
    <circle cx="166" cy="49" r="12" fill="#fff" fill-opacity=".95"/>
    <path d="M160 49l4.5 4.5L172.500 44" stroke="#1652F0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="188" y="40" width="130" height="9" rx="4.500" fill="#fff"/>
    <rect x="188" y="56" width="84" height="6" rx="3" fill="#fff" fill-opacity=".65"/>
    <rect x="158" y="92" width="86" height="7" rx="3.500" fill="#0F1B3D"/>
    <rect x="158" y="108" width="196" height="6" rx="3" fill="#D3DBEE"/>
    <rect x="158" y="122" width="170" height="6" rx="3" fill="#D3DBEE"/>
    <rect x="158" y="136" width="184" height="6" rx="3" fill="#D3DBEE"/>
    <rect x="158" y="150" width="120" height="6" rx="3" fill="#D3DBEE"/>
    <path d="M160 196c10-16 18 8 28-6s16 10 26-4 14 6 22-2" stroke="#1652F0" stroke-width="3" stroke-linecap="round"/>
    <rect x="160" y="204" width="76" height="4" rx="2" fill="#C9D3EA"/>
    <!-- seal -->
    <path d="M338 186l-10 30 14-6 8 12 8-34z" fill="#F59E0B"/>
    <path d="M360 186l12 30-14-6-6 12-8-34z" fill="#D97706"/>
    <circle cx="350" cy="168" r="28" fill="url(#ga)"/>
    <circle cx="350" cy="168" r="21" stroke="#fff" stroke-opacity=".75" stroke-width="2" stroke-dasharray="3 3"/>
    <path d="M350 154l4 8.500 9.500 1.200-7 6.500 1.800 9.300-8.300-4.700-8.300 4.700 1.800-9.300-7-6.500 9.500-1.200z" fill="#fff"/>
  </g>

  <!-- phone with checklist -->
  <g filter="url(#sh)">
    <rect x="40" y="168" width="134" height="244" rx="26" fill="#0F1B3D"/>
    <rect x="49" y="177" width="116" height="226" rx="19" fill="#FFFFFF"/>
    <rect x="86" y="183" width="42" height="9" rx="4.500" fill="#0F1B3D"/>
    <rect x="62" y="204" width="68" height="8" rx="4" fill="#0F1B3D"/>
    <rect x="62" y="218" width="44" height="5" rx="2.500" fill="#B7C2DD"/>
    <g>
      <rect x="60" y="236" width="94" height="30" rx="9" fill="#EAF9EF"/>
      <circle cx="75" cy="251" r="8" fill="#16A34A"/><path d="M71 251l3 3 6-6" stroke="#fff" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="90" y="246" width="50" height="6" rx="3" fill="#0F1B3D" fill-opacity=".75"/><rect x="90" y="256" width="32" height="4" rx="2" fill="#16A34A" fill-opacity=".5"/>
      <rect x="60" y="272" width="94" height="30" rx="9" fill="#EAF9EF"/>
      <circle cx="75" cy="287" r="8" fill="#16A34A"/><path d="M71 287l3 3 6-6" stroke="#fff" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="90" y="282" width="44" height="6" rx="3" fill="#0F1B3D" fill-opacity=".75"/><rect x="90" y="292" width="36" height="4" rx="2" fill="#16A34A" fill-opacity=".5"/>
      <rect x="60" y="308" width="94" height="30" rx="9" fill="#EAF0FF"/>
      <circle cx="75" cy="323" r="8" stroke="#1652F0" stroke-width="2.500"/>
      <rect x="90" y="318" width="48" height="6" rx="3" fill="#0F1B3D" fill-opacity=".75"/><rect x="90" y="328" width="26" height="4" rx="2" fill="#1652F0" fill-opacity=".45"/>
      <rect x="60" y="344" width="94" height="30" rx="9" fill="#F3F5FA"/>
      <circle cx="75" cy="359" r="8" stroke="#B7C2DD" stroke-width="2.500"/>
      <rect x="90" y="354" width="40" height="6" rx="3" fill="#B7C2DD"/><rect x="90" y="364" width="28" height="4" rx="2" fill="#D3DBEE"/>
    </g>
    <rect x="62" y="383" width="90" height="12" rx="6" fill="url(#gb)"/>
  </g>

  <!-- approved badge -->
  <g filter="url(#sh2)">
    <circle cx="414" cy="206" r="30" fill="#16A34A"/>
    <circle cx="414" cy="206" r="30" stroke="#fff" stroke-width="5"/>
    <path d="M400 207l10 10 18-20" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- rupee coin -->
  <g filter="url(#sh2)">
    <circle cx="92" cy="116" r="27" fill="url(#ga)"/>
    <circle cx="92" cy="116" r="20" stroke="#fff" stroke-opacity=".7" stroke-width="2"/>
    <text x="92" y="125" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="25" fill="#fff">&#8377;</text>
  </g>

  <!-- office pin -->
  <g filter="url(#sh2)">
    <path d="M596 262c-17 0-30 13-30 29 0 22 30 52 30 52s30-30 30-52c0-16-13-29-30-29z" fill="#EF4444"/>
    <circle cx="596" cy="290" r="11" fill="#fff"/>
  </g>
  <ellipse cx="596" cy="346" rx="22" ry="5" fill="#0F1B3D" fill-opacity=".14"/>

  <!-- sparkles -->
  <g fill="#F59E0B"><path d="M520 70l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/><path d="M122 62l2.200 6 6 2.200-6 2.200-2.200 6-2.200-6-6-2.200 6-2.200z"/></g>
  <g fill="#1652F0" fill-opacity=".8"><path d="M610 160l2.500 6.500 6.500 2.500-6.500 2.500-2.500 6.500-2.500-6.500-6.500-2.500 6.500-2.500z"/><path d="M26 250l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/></g>
  <circle cx="470" cy="38" r="5" fill="#16A34A" fill-opacity=".6"/><circle cx="40" cy="90" r="4" fill="#1652F0" fill-opacity=".5"/>
</svg>
